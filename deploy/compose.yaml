services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: aulia
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.3-alpine
    ports:
      - "127.0.0.1:6379:6379"

  grafana:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - valkey
      - grafana

volumes:
  postgres-data:

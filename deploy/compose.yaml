services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: aulia
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aulia"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine
    ports:
      - "127.0.0.1:6379:6379"

  grafana:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aulia
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      grafana:
        condition: service_started

volumes:
  postgres-data:

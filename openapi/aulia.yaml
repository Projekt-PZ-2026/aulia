openapi: 3.1.0
info:
  title: Aulia
  version: 0.1.0
paths:
  /api/ping:
    get:
      operationId: getPing
      responses:
        "200":
          description: Backend is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
  /api/staff/announcement:
    put:
      operationId: saveAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAnnouncementRequest"
      responses:
        "200":
          description: Saved announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "400":
          description: Text is empty or longer than 500 characters
  /api/family/announcement:
    get:
      operationId: getAnnouncement
      responses:
        "200":
          description: Latest announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "204":
          description: No announcement yet
components:
  schemas:
    Ping:
      type: object
      required:
        - status
        - time
      properties:
        status:
          type: string
        time:
          type: string
          format: date-time
    Announcement:
      type: object
      required:
        - id
        - text
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    SaveAnnouncementRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
